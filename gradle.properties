# AndroidX обязателен для всех androidx-библиотек (Room, Navigation, Lifecycle и т.д.)
# и для плагина androidx.navigation.safeargs, который иначе падает с ошибкой
# "androidx.navigation.safeargs can only be used with an androidx project".
android.useAndroidX=true
android.enableJetifier=false

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.nonTransitiveRClass=true
